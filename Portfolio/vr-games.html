<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>VR Games</title>
    <link rel="stylesheet" href="/Styles/vr-games.css" />
    <link rel="icon" href="/Media/Icons/game-vr-icon.png" type="image/png" />
  </head>
  <body>
    <header>
      <div class="main-menu">
        <a href="../index.html">
          <img src="../Media/Logos/LogotipoBlanco.png" alt="Menu" width="50" />

      </div>
    </header>

    <main>
      <div class="content"></div>
      <div class="main-container">
